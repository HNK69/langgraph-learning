readme = "README.md"
authors = [
    { name = "hnkrupaal", email = "hnkrupaal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
